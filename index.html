<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<style>

<script type="importmap">
{"imports":{
"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",

<body>
<div id="aviso">A carregar…</div>
<div id="arContainer"></div>
<div id="overlay">
  <button id="voltar" class="btn" type="button">Voltar</button>
  <div id="dica">Aponta a câmara para a imagem da árvore</div>
  <div id="nota"></div>
  <button id="botaoAR" class="btn" type="button">Ver no papel</button>
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshSurfaceSampler } from 'three/addons/math/MeshSurfaceSampler.js';

// ================= CONFIGURAÇÃO =================
// Para acrescentar uma árvore: copia um bloco, muda os nomes dos ficheiros
// e o "alvo" (0 = 1.ª imagem do .mind, 1 = 2.ª, 2 = 3.ª).
// O número de áudios define o número de sectores da copa (máx. 8).
const ARVORES = [
  {
    modelo: 'models/arvore1.glb',
    alvo: 0,
    audios: ['audio/arvore1_1.mp3', 'audio/arvore1_2.mp3', 'audio/arvore1_3.mp3'],
    link: '',                      // link do website (vazio = mostra "Website em construção")
    textoBotao: 'Saber mais'
  }
];
const MARCADOR = 'targets/targets.mind';   // um só ficheiro com todas as imagens, pela ordem dos alvos

const N_AMOSTRAS = 150000;   // pontos gerados na superfície (só os da copa ficam)
const TAMANHO_PONTO = 0.005; // diâmetro do ponto, em fração da altura da árvore
const DISPERSAO = 0.35;      // distância da dispersão, em fração da altura
const TEMPO_REGRESSO = 1.5;  // segundos até a árvore recompor
const TRONCO_ATE = 0.35;     // fração da altura abaixo da qual é tronco
const ALTURA_AR = 0.9;       // altura da árvore em AR (largura do marcador = 1)
const LIMITE_ARRASTO = 12;   // px: acima disto o gesto passa a rodar a árvore
const VEL_GIRO = 0.25;       // rotação automática ligeira (rad/s)
const N_ORBITA = 1400;       // partículas por anel (metade visível em repouso, todas ao tocar)
const VEL_ORBITA = 0.15;     // velocidade de rotação dos anéis (rad/s)
const TAMANHO_ORBITA = 0.005;
const CORES = [0xa6e06a, 0x3fc27f, 0x1f9e8a]; // verde lima, verde esmeralda, verde azulado (de baixo para cima)
const ZOOM_MIN = 0.4, ZOOM_MAX = 3;

// ================= BASE =================
const $ = id => document.getElementById(id);
const aviso = $('aviso'), botaoAR = $('botaoAR'), voltar = $('voltar'), dica = $('dica'), nota = $('nota'), arC = $('arContainer'), overlay = $('overlay');
const _p = new THREE.Vector3(), _o = new THREE.Quaternion(), _e = new THREE.Vector3(), _v = new THREE.Vector3(), _s = new THREE.Vector2(), _q = new THREE.Quaternion(), _y = new THREE.Vector3(0, 1, 0);
let arAtivo = false, carregado = false, autoRot = true, mindarAtivo = null;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.01, 100);

function luzes(s) {
  s.add(new THREE.HemisphereLight(0xffffff, 0x526047, 1.5));
  const a = new THREE.DirectionalLight(0xffffff, 2); a.position.set(3, 5, 4); s.add(a);
  const b = new THREE.DirectionalLight(0xffffff, 0.7); b.position.set(-3, 2, -4); s.add(b);
}
luzes(scene);

function mostrarNota(t) {
  nota.textContent = t; nota.style.display = 'block';
  setTimeout(() => nota.style.display = 'none', 2500);
}

// ================= SHADERS =================
// uCopa = (centro x, altura do tronco, centro z, nº de sectores)
const GLSL_ZONA = `uniform vec4 uCopa; uniform float uTopo; uniform float uZona[8];
float zonaDe(vec3 p){ if(p.y<uCopa.y) return -1.;
  float t=(p.y-uCopa.y)/max(uTopo-uCopa.y,.0001);
  return min(floor(t*uCopa.w),uCopa.w-1.); }`;

const VERT_PONTOS = `attribute vec3 aRand; attribute float aZona;
uniform vec4 uCopa; uniform float uZona[8]; uniform float uSizeWorld, uScale, uScatter, uTime;
varying vec3 vColor; varying float vAlpha;
void main(){
  float s=uZona[int(aZona)];
  if(s<0.01){ gl_Position=vec4(2.,2.,2.,1.); gl_PointSize=0.; vColor=vec3(0.); vAlpha=0.; return; }
  float e=s*s*(3.-2.*s);
  vec3 dir=normalize(vec3(position.x-uCopa.x,0.4,position.z-uCopa.z)+aRand*0.8);
  vec3 p=position+dir*uScatter*e*(0.4+0.6*abs(aRand.x));
  p+=aRand*0.15*uScatter*e*sin(uTime*1.5+aRand.y*6.28);
  vec4 mv=modelViewMatrix*vec4(p,1.);
  gl_PointSize=max(1.5,uSizeWorld*uScale/max(-mv.z,0.01));
  gl_Position=projectionMatrix*mv;
  vColor=color; vAlpha=clamp(s*1.5,0.,1.);
}`;
const FRAG_PONTOS = `varying vec3 vColor; varying float vAlpha;
void main(){ vec2 q=gl_PointCoord-.5; float d=dot(q,q); if(d>.25) discard;
  gl_FragColor=vec4(vColor,vAlpha*(1.-smoothstep(.12,.25,d)));
  #include <colorspace_fragment>
}`;

const VERT_ORBITA = `attribute vec3 aOrb; attribute float aZona; attribute float aRank;
uniform vec4 uCopa; uniform float uZona[8]; uniform float uTopo, uRaio, uTime, uSizeOrb, uScale, uMinPx;
varying vec3 vColor; varying float vAlpha;
void main(){
  float i=aZona, s=uZona[int(i)];
  if(aRank>.5+.5*s){ gl_Position=vec4(2.,2.,2.,1.); gl_PointSize=0.; vColor=vec3(0.); vAlpha=0.; return; }
  float camada=(uTopo-uCopa.y)/uCopa.w;
  float dir=mod(i,2.)<.5?1.:-1.;
  float ang=aOrb.x+uTime*(${VEL_ORBITA.toFixed(3)}*(1.+.25*i))*dir;
  float irr=1.+(.22*sin(ang*2.+i*1.7+uTime*.2)+.12*sin(ang*3.+i*4.1-uTime*.15))*(1.-.5*s)+aOrb.y*.12*(1.-.7*s);
  float r=uRaio*irr;
  float dy=camada*(.35*sin(ang*2.+i*2.3+uTime*.25)*(1.-.5*s)+aOrb.z*.3*(1.-.7*s));
  vec3 p=vec3(uCopa.x+cos(ang)*r, uCopa.y+(i+.5)*camada+dy, uCopa.z+sin(ang)*r);
  vec4 mv=modelViewMatrix*vec4(p,1.);
  gl_PointSize=max(uMinPx,uSizeOrb*uScale/max(-mv.z,.01));
  gl_Position=projectionMatrix*mv;
  vColor=min(color*(1.+s*.6),vec3(1.)); vAlpha=.8+.2*s;
}`;

// ================= ÁRVORE =================
class Arvore {
  constructor(cfg) {
    this.cfg = cfg;
    this.n = Math.min(cfg.audios.length, 8) || 1;
    this.raiz = new THREE.Group(); this.grupo = new THREE.Group(); this.raiz.add(this.grupo);
    this.forca = new Float32Array(8);
    this.ativa = [];
    this.zoom = 1; this.base = 1;
    this.audios = cfg.audios.map((src, z) => { const a = new Audio(src); a.loop = false; a.preload = 'auto'; a.onended = () => { this.ativa[z] = false; }; return a; });
    this.u = {
      uCopa: { value: new THREE.Vector4() }, uZona: { value: Array(8).fill(0) },
      uInv: { value: new THREE.Matrix4() }, uSizeWorld: { value: 0 },
      uScale: { value: 1 }, uScatter: { value: 0 }, uTime: { value: 0 },
      uTopo: { value: 1 }, uRaio: { value: 1 }, uSizeOrb: { value: 0 }, uMinPx: { value: 2 }
    };
    this.btn = document.createElement('button');
    this.btn.className = 'tronco';
    this.btn.textContent = cfg.textoBotao || 'Saber mais';
    this.btn.onclick = () => cfg.link ? window.open(cfg.link, '_blank') : mostrarNota('Website em construção');
    overlay.appendChild(this.btn);
  }

  zonaDe(p) {
    const c = this.u.uCopa.value;
    if (p.y < c.y) return -1;
    const t = (p.y - c.y) / Math.max(this.u.uTopo.value - c.y, 1e-4);
    return Math.min(Math.floor(t * this.n), this.n - 1);
  }

  async carregar() {
    const gltf = await new GLTFLoader().loadAsync(this.cfg.modelo);
    const m = gltf.scene, g = this.grupo;
    g.add(m); m.updateMatrixWorld(true);
    const box = new THREE.Box3().setFromObject(m), c = box.getCenter(new THREE.Vector3());
    this.alt = box.max.y - box.min.y;
    if (!(this.alt > 0)) throw new Error('Modelo sem geometria: ' + this.cfg.modelo);
    m.position.set(-c.x, -box.min.y, -c.z);
    g.updateMatrixWorld(true);
    const meshes = [];
    m.traverse(o => o.isMesh && meshes.push(o));
    this.criarPontos(meshes);
    this.grupo.position.y = -this.alt / 2;   // pivô de rotação no centro da árvore
  }

  // O modelo realista desfaz-se por zona (descarta fragmentos com ruído)
  dissolver(o) {
    const u = this.u;
    [].concat(o.material).forEach(mt => {
      mt.onBeforeCompile = s => {
        Object.assign(s.uniforms, u);
        s.vertexShader = 'uniform mat4 uInv; varying vec3 vTP;\n' + s.vertexShader.replace('#include <project_vertex>',
          '#include <project_vertex>\nvTP=(uInv*modelMatrix*vec4(transformed,1.)).xyz;');
        s.fragmentShader = 'varying vec3 vTP;\n' + GLSL_ZONA + '\n' + s.fragmentShader.replace('#include <clipping_planes_fragment>',
          '#include <clipping_planes_fragment>\n{float z=zonaDe(vTP); if(z>=0.){ float s=uZona[int(z)];' +
          ' if(s>.001 && fract(sin(dot(vTP,vec3(12.9898,78.233,37.719))*40.)*43758.5453)<s*1.05) discard; }}');
      };
      mt.customProgramCacheKey = () => 'dissolve';
      mt.needsUpdate = true;
    });
  }

  // Nuvem de pontos gerada a partir do próprio modelo (mesma forma, mesmas cores)
  criarPontos(meshes) {
    const rel = new THREE.Matrix4().copy(this.grupo.matrixWorld).invert();
    const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
    let total = 0;
    const info = meshes.map(o => {
      const pos = o.geometry.attributes.position, idx = o.geometry.index;
      const M = new THREE.Matrix4().multiplyMatrices(rel, o.matrixWorld);
      let A = 0;
      const nt = (idx ? idx.count : pos.count) / 3;
      for (let i = 0; i < nt; i++) {
        const f = j => idx ? idx.getX(i * 3 + j) : i * 3 + j;
        a.fromBufferAttribute(pos, f(0)); b.fromBufferAttribute(pos, f(1)); c.fromBufferAttribute(pos, f(2));
        A += b.sub(a).cross(c.sub(a)).length() / 2;
      }
      A *= M.getMaxScaleOnAxis() ** 2; total += A;
      return { o, M, A };
    });

    const P = [], C = [];
    const p = new THREE.Vector3(), n = new THREE.Vector3(), cc = new THREE.Color(), col = new THREE.Color(), uv = new THREE.Vector2();
    for (const { o, M, A } of info) {
      const k = Math.round(N_AMOSTRAS * A / total);
      if (!k) continue;
      const mat = [].concat(o.material)[0];
      let t = null;
      const im = mat.map && mat.map.image;
      if (im) {
        const w = Math.min(im.width, 1024), h = Math.min(im.height, 1024);
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        const x = cv.getContext('2d', { willReadFrequently: true });
        x.drawImage(im, 0, 0, w, h);
        t = { d: x.getImageData(0, 0, w, h).data, w, h };
      }
      const vc = !!o.geometry.attributes.color;
      const s = new MeshSurfaceSampler(o).build();
      for (let i = 0, tent = 0; i < k && tent < k * 4; tent++) {
        s.sample(p, n, cc, uv);
        if (t) {
          const px = Math.min(t.w - 1, Math.floor((uv.x - Math.floor(uv.x)) * t.w));
          const py = Math.min(t.h - 1, Math.floor((uv.y - Math.floor(uv.y)) * t.h));
          const j = (py * t.w + px) * 4;
          if (t.d[j + 3] < 128) continue;          // salta zonas transparentes das folhas
          col.setRGB(t.d[j] / 255, t.d[j + 1] / 255, t.d[j + 2] / 255, THREE.SRGBColorSpace);
        } else col.setRGB(1, 1, 1);
        col.multiply(mat.color);
        if (vc) col.multiply(cc);
        p.applyMatrix4(M);
        P.push(p.x, p.y, p.z); C.push(col.r, col.g, col.b);
        i++;
      }
    }

    const H = this.alt, ty = H * TRONCO_ATE;
    const mn = new THREE.Vector3(1e9, 1e9, 1e9), mx = new THREE.Vector3(-1e9, -1e9, -1e9);
    let sx = 0, sz = 0, ns = 0;
    for (let i = 0; i < P.length; i += 3) {
      _v.set(P[i], P[i + 1], P[i + 2]);
      if (_v.y >= ty) { mn.min(_v); mx.max(_v); }
      else if (_v.y > H * 0.05) { sx += _v.x; sz += _v.z; ns++; }
    }
    if (mn.x > mx.x) throw new Error('Não encontrei copa acima do tronco (ajusta TRONCO_ATE).');
    const cx = (mn.x + mx.x) / 2, cy = (mn.y + mx.y) / 2, cz = (mn.z + mx.z) / 2;
    this.u.uCopa.value.set(cx, ty, cz, this.n);
    this.u.uTopo.value = mx.y;
    this.u.uRaio.value = Math.max(mx.x - mn.x, mx.z - mn.z) / 2 * 1.15;
    this.pBtn = new THREE.Vector3(ns ? sx / ns : cx, ty * 0.55, ns ? sz / ns : cz);

    const pos = [], cor = [], rnd = [], zon = [];
    for (let i = 0; i < P.length; i += 3) {
      if (P[i + 1] < ty) continue;
      _v.set(P[i], P[i + 1], P[i + 2]);
      pos.push(P[i], P[i + 1], P[i + 2]); cor.push(C[i], C[i + 1], C[i + 2]);
      rnd.push(Math.random() * 2 - 1, Math.random() * 2 - 1, Math.random() * 2 - 1);
      zon.push(this.zonaDe(_v));
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.Float32BufferAttribute(cor, 3));
    geo.setAttribute('aRand', new THREE.Float32BufferAttribute(rnd, 3));
    geo.setAttribute('aZona', new THREE.Float32BufferAttribute(zon, 1));
    this.pts = new THREE.Points(geo, new THREE.ShaderMaterial({
      uniforms: this.u, vertexShader: VERT_PONTOS, fragmentShader: FRAG_PONTOS,
      vertexColors: true, transparent: true, depthWrite: false
    }));
    this.pts.frustumCulled = false; this.pts.visible = false;
    this.grupo.add(this.pts);

    // Anéis de partículas coloridas a girar em volta da copa (um por zona e por áudio)
    const camada = (mx.y - ty) / this.n, R = this.u.uRaio.value;
    const op = [], oc = [], oz = [], oo = [], orr = [];
    this.toros = [];
    for (let z = 0; z < this.n; z++) {
      const cor = new THREE.Color(CORES[z % CORES.length]);
      for (let i = 0; i < N_ORBITA; i++) {
        op.push(0, 0, 0); oc.push(cor.r, cor.g, cor.b); oz.push(z);
        oo.push(Math.random() * 6.2832, Math.random() * 2 - 1, Math.random() * 2 - 1); orr.push(i / N_ORBITA);
      }
      // cilindro invisível por camada: é nele que se toca
      const tor = new THREE.Mesh(new THREE.CylinderGeometry(R * 1.35, R * 1.35, camada, 16, 1), new THREE.MeshBasicMaterial({ visible: false }));
      tor.position.set(cx, ty + (z + 0.5) * camada, cz); tor.userData.zona = z;
      this.grupo.add(tor); this.toros.push(tor);
    }
    const og = new THREE.BufferGeometry();
    og.setAttribute('position', new THREE.Float32BufferAttribute(op, 3));
    og.setAttribute('color', new THREE.Float32BufferAttribute(oc, 3));
    og.setAttribute('aZona', new THREE.Float32BufferAttribute(oz, 1));
    og.setAttribute('aOrb', new THREE.Float32BufferAttribute(oo, 3));
    og.setAttribute('aRank', new THREE.Float32BufferAttribute(orr, 1));
    this.orbita = new THREE.Points(og, new THREE.ShaderMaterial({
      uniforms: this.u, vertexShader: VERT_ORBITA, fragmentShader: FRAG_PONTOS,
      vertexColors: true, transparent: true, depthWrite: false
    }));
    this.tronco = new THREE.Mesh(new THREE.CylinderGeometry(R * 0.6, R * 0.6, ty, 12, 1), new THREE.MeshBasicMaterial({ visible: false }));
    this.tronco.position.set(cx, ty / 2, cz); this.grupo.add(this.tronco);   // só para saber se o toque foi no modelo
    this.orbita.frustumCulled = false;
    this.grupo.add(this.orbita);
  }

  visivel() {
    for (let o = this.grupo; o; o = o.parent) if (!o.visible) return false;
    return !!this.grupo.parent;
  }

  zonaTocada(ray) {
    this.grupo.updateMatrixWorld(true);
    const h = ray.intersectObjects(this.toros, false)[0];
    return h ? h.object.userData.zona : -1;
  }

  dentro(ray) {
    this.grupo.updateMatrixWorld(true);
    return ray.intersectObjects([...this.toros, this.tronco], false).length > 0;
  }
  parar() {
    this.audios.forEach(a => { a.pause(); a.currentTime = 0; });
    this.ativa.fill(false);
  }

  premir(z) {
    if (this.ativa[z]) return;                 // já a tocar: corre até ao fim
    this.ativa[z] = true;
    const a = this.audios[z], falha = () => setTimeout(() => { this.ativa[z] = false; }, 2500);
    if (!a) return falha();
    a.currentTime = 0;
    a.play().catch(falha);
  }
  largar() {}

  atualizar(dt, cam, alturaPx) {
    const u = this.u;
    u.uTime.value += dt;
    this.raiz.quaternion.multiply(_q.setFromAxisAngle(_y, VEL_GIRO * dt));   // giro ligeiro permanente
    this.raiz.scale.setScalar(this.base * this.zoom);
    this.grupo.updateWorldMatrix(true, false);
    u.uInv.value.copy(this.grupo.matrixWorld).invert();
    u.uSizeWorld.value = TAMANHO_PONTO * this.alt * this.raiz.scale.x;
    u.uScatter.value = DISPERSAO * this.alt;
    u.uMinPx.value = 1.6 * alturaPx / innerHeight;
    u.uSizeOrb.value = TAMANHO_ORBITA * this.alt * this.raiz.scale.x;
    u.uScale.value = alturaPx / (2 * Math.tan(cam.fov * Math.PI / 360));
    let ativo = false;
    for (let z = 0; z < this.n; z++) {
      const alvo = this.ativa[z] ? 1 : 0;
      let f = this.forca[z];
      f = alvo > f ? Math.min(1, f + dt * 3) : Math.max(0, f - dt / TEMPO_REGRESSO);
      this.forca[z] = f; u.uZona.value[z] = f;
      if (f > 0) ativo = true;
    }
    if (this.pts) this.pts.visible = ativo;
  }

  posicionarBotao(cam, mostrar) {
    if (!mostrar || !this.pBtn || !this.visivel()) { this.btn.style.display = 'none'; return; }
    _v.copy(this.pBtn); this.grupo.localToWorld(_v); _v.project(cam);
    if (_v.z > 1) { this.btn.style.display = 'none'; return; }
    this.btn.style.display = 'block';
    this.btn.style.left = (_v.x * 0.5 + 0.5) * innerWidth + 'px';
    this.btn.style.top = (-_v.y * 0.5 + 0.5) * innerHeight + 'px';
  }
}

const arvores = ARVORES.map(c => new Arvore(c));

// ================= GESTOS =================
// Toque rápido num anel = áudio (corre até ao fim) + dispersão. Toque fora da árvore = pára o áudio. 1 dedo a arrastar = rodar (x e y).
// 2 dedos = zoom (afastar/juntar) e rotação no 3.º eixo (rodar os dedos). Roda do rato = zoom.
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
function rodar(a, eixoMundo, ang) {
  const qp = a.raiz.parent.getWorldQuaternion(new THREE.Quaternion()).invert();
  a.raiz.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(eixoMundo.clone().applyQuaternion(qp), ang));
}
function ligarGestos(cam, ativas) {
  const ray = new THREE.Raycaster(), nd = new THREE.Vector2(), P = new Map();
  let cand = null, dentro = false, d0 = 1, a0 = 0;
  const eixo = (x, y, z) => new THREE.Vector3(x, y, z).applyQuaternion(cam.getWorldQuaternion(new THREE.Quaternion()));
  const par = () => { const [a, b] = [...P.values()]; return { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, ang: Math.atan2(b.y - a.y, b.x - a.x) }; };
  addEventListener('pointerdown', e => {
    if (e.target.closest && e.target.closest('button')) return;
    P.set(e.pointerId, { x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY });
    cand = null;
    if (P.size === 1) {
      nd.set(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1);
      ray.setFromCamera(nd, cam);
      for (const a of ativas()) { const z = a.zonaTocada(ray); if (z >= 0) { cand = { a, z }; break; } }
      dentro = ativas().some(a => a.dentro(ray));
    } else if (P.size === 2) { const q = par(); d0 = q.d; a0 = q.ang; }
  });
  addEventListener('pointermove', e => {
    const p = P.get(e.pointerId); if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
    if (P.size === 1) {
      if (cand && Math.hypot(p.x - p.x0, p.y - p.y0) > LIMITE_ARRASTO) cand = null;   // passou a arrastar
      if (!cand) { const up = eixo(0, 1, 0), dir = eixo(1, 0, 0); ativas().forEach(a => { rodar(a, up, dx * 0.01); rodar(a, dir, dy * 0.01); }); }
    } else if (P.size === 2) {
      const q = par(), fw = eixo(0, 0, -1);
      let d = q.ang - a0; d = Math.atan2(Math.sin(d), Math.cos(d));
      ativas().forEach(a => { a.zoom = clamp(a.zoom * q.d / d0, ZOOM_MIN, ZOOM_MAX); rodar(a, fw, d); });
      d0 = q.d; a0 = q.ang;
    }
  });
  addEventListener('pointerup', e => {
    const unico = P.size === 1, p = P.get(e.pointerId);
    const toque = unico && p && Math.hypot(p.x - p.x0, p.y - p.y0) <= LIMITE_ARRASTO;
    P.delete(e.pointerId);
    if (cand && toque) cand.a.premir(cand.z);      // toque rápido: dispara o áudio dentro do gesto do utilizador
    else if (toque && !dentro) ativas().forEach(a => a.parar());   // toque fora da árvore e dos anéis: pára o áudio
    cand = null;
    if (P.size === 1) { const v = [...P.values()][0]; v.x0 = v.x; v.y0 = v.y; cand = null; }
  });
  addEventListener('pointercancel', e => { P.delete(e.pointerId); cand = null; });
  addEventListener('wheel', e => ativas().forEach(a => a.zoom = clamp(a.zoom * (1 - e.deltaY * 0.001), ZOOM_MIN, ZOOM_MAX)), { passive: true });
}

// ================= AR =================
async function iniciarAR() {
  if (arAtivo || !carregado) return;
  arAtivo = true; botaoAR.style.display = 'none';
  try {
    const { MindARThree } = await import('mindar-image-three');
    arC.style.display = 'block';
    const mindar = new MindARThree({ container: arC, imageTargetSrc: MARCADOR, uiLoading: 'no', uiScanning: 'no', uiError: 'no', filterMinCF: 0.0001, filterBeta: 1000, missTolerance: 10, warmupTolerance: 5 });
    mindarAtivo = mindar;
    const { renderer: r, scene: s, camera: cam } = mindar;
    s.background = null; r.setClearColor(0x000000, 0);
    luzes(s);

    arvores.forEach(a => {
      const anc = mindar.addAnchor(a.cfg.alvo);
      const seg = new THREE.Group();            // segue o marcador de forma suavizada
      seg.visible = false; s.add(seg);
      a.base = ALTURA_AR / a.alt; a.zoom = 1;
      a.raiz.position.set(0, 0, 0); a.raiz.quaternion.identity();
      seg.add(a.raiz);                          // sem rotação extra: fica paralela ao marcador
      a.anc = anc; a.seg = seg; a.snap = true; a.visto = -1e9;
      anc.onTargetFound = () => { dica.style.display = 'none'; };
      anc.onTargetLost = () => { dica.style.display = 'block'; };
    });

    renderer.setAnimationLoop(null);
    renderer.domElement.style.display = 'none';
    await mindar.start();
    voltar.style.display = 'block'; dica.style.display = 'block';
    ligarGestos(cam, () => arvores.filter(a => a.visivel()));

    let t0 = performance.now();
    r.setAnimationLoop(() => {
      const t = performance.now(), dt = Math.min((t - t0) / 1000, 0.05); t0 = t;
      const H = r.getDrawingBufferSize(_s).y, k = 1 - Math.exp(-dt * 12);
      arvores.forEach(a => {
        const g = a.anc.group;
        if (g.visible) {
          g.matrix.decompose(_p, _o, _e);
          if (a.snap) { a.seg.position.copy(_p); a.seg.quaternion.copy(_o); a.seg.scale.copy(_e); a.snap = false; }
          else { a.seg.position.lerp(_p, k); a.seg.quaternion.slerp(_o, k); a.seg.scale.lerp(_e, k); }
          a.visto = t; a.seg.visible = true;
        } else if (t - a.visto > 1500) { a.seg.visible = false; a.snap = true; }
        a.atualizar(dt, cam, H); a.posicionarBotao(cam, true);
      });
      r.render(s, cam);
    });
  } catch (erro) {
    console.error(erro);
    if (mindarAtivo) { try { await mindarAtivo.stop(); } catch (e) {} mindarAtivo = null; }
    arC.style.display = 'none'; renderer.domElement.style.display = 'block';
    mostrarNota('Não foi possível iniciar a realidade aumentada. Verifica a câmara, o marcador e a ligação.');
    voltar.style.display = 'none'; botaoAR.style.display = 'block';
    arAtivo = false;
    location.reload();
  }
}
botaoAR.addEventListener('click', iniciarAR);
voltar.addEventListener('click', () => location.reload());

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ================= ARRANQUE (pré-visualização da 1.ª árvore) =================
(async () => {
  try {
    for (let i = 0; i < arvores.length; i++) {
      aviso.textContent = `A carregar a árvore ${i + 1} de ${arvores.length}…`;
      await arvores[i].carregar();
    }
    const a = arvores[0];
    scene.add(a.raiz);
    a.base = 1;
    camera.position.set(0, a.alt * 0.05, a.alt * 1.7);
    camera.lookAt(0, 0, 0);
    ligarGestos(camera, () => arAtivo ? [] : [a]);
    carregado = true; aviso.remove();
    let t0 = performance.now();
    renderer.setAnimationLoop(() => {
      const t = performance.now(), dt = Math.min((t - t0) / 1000, 0.05); t0 = t;
      a.atualizar(dt, camera, renderer.domElement.height);
      a.posicionarBotao(camera, !arAtivo);
      renderer.render(scene, camera);
    });
  } catch (erro) {
    console.error(erro);
    aviso.textContent = 'Erro ao carregar: ' + (erro.message || erro);
  }
})();
</script>
