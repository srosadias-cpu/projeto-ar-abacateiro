
<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Abacateiro AR</title>

<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: system-ui, sans-serif;
  }

  canvas {
    display: block;
    touch-action: none;
  }

  #aviso {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #cfd8c8;
    font-size: 15px;
    text-align: center;
    padding: 24px;
    z-index: 20;
  }

  #arContainer {
    position: fixed;
    inset: 0;
    display: none;
    overflow: hidden;
    z-index: 1;
    background: transparent;
    touch-action: none;
  }

  #arContainer canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
  }

  #overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
  }

  #overlay > * {
    pointer-events: auto;
  }

  .btn {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    padding: 14px 26px;
    border: 1px solid #cfd8c8;
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.65);
    color: #e9efe4;
    text-decoration: none;
    font-size: 15px;
    white-space: nowrap;
    font-family: inherit;
    cursor: pointer;
  }

  #botaoAR {
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  }

  #voltar {
    top: calc(20px + env(safe-area-inset-top, 0px));
    display: none;
  }

  #dica {
    position: fixed;
    top: calc(80px + env(safe-area-inset-top, 0px));
    left: 50%;
    transform: translateX(-50%);
    display: none;
    padding: 10px 18px;
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.6);
    color: #e9efe4;
    font-size: 14px;
    text-align: center;
    max-width: 80%;
  }

  #nota {
    position: fixed;
    left: 12px;
    right: 12px;
    text-align: center;
    color: #b9c4b3;
    font-size: 13px;
    display: none;
    bottom: calc(90px + env(safe-area-inset-bottom, 0px));
  }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
  }
}
</script>
</head>

<body>

<div id="aviso">A carregar o abacateiro…</div>
<div id="arContainer"></div>

<div id="overlay">
  <button id="voltar" class="btn" type="button">Voltar</button>
  <div id="dica">Aponta a câmara para a imagem do abacateiro</div>
  <div id="nota"></div>
  <button id="botaoAR" class="btn" type="button">Ver no papel</button>
</div>

<script type="module">

import * as THREE from 'three';

import { OrbitControls } from
  'three/addons/controls/OrbitControls.js';

import { GLTFLoader } from
  'three/addons/loaders/GLTFLoader.js';


// ==================================================
// FICHEIROS
// ==================================================

const MODELO = 'models/Abacateiro_Arvore3.glb';
const FICHEIRO = 'pointclouds/abacateiro_pontos.bin';
const MARCADOR = 'targets/targets.mind';


// ==================================================
// CONFIGURAÇÃO
// ==================================================

const MAX_PONTOS = 100000;

const TAMANHO_PONTO = 0.012;
const BRILHO = 1.3;

const RAIO_TOQUE = 0.45;
const FORCA_DISPERSAO = 0.28;
const TEMPO_REGRESSO = 1.5;

const ALTURA_AR = 0.7;
const ROTACAO_AR = 0.15;

// Evita activar partículas no tronco.
// A zona de toque começa a 35% da altura da árvore.
const ALTURA_MINIMA_TOQUE = 0.35;


// ==================================================
// ELEMENTOS HTML
// ==================================================

const aviso = document.getElementById('aviso');
const botaoAR = document.getElementById('botaoAR');
const voltar = document.getElementById('voltar');
const dica = document.getElementById('dica');
const nota = document.getElementById('nota');
const arContainer = document.getElementById('arContainer');


// ==================================================
// THREE.JS: PRÉ-VISUALIZAÇÃO
// ==================================================

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: false
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.setClearColor(0x000000, 1);
renderer.outputColorSpace = THREE.SRGBColorSpace;

document.body.appendChild(renderer.domElement);


const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  45,
  window.innerWidth / window.innerHeight,
  0.01,
  100
);


// Controlos da pré-visualização

const controls = new OrbitControls(
  camera,
  renderer.domElement
);

controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;


// Iluminação da pré-visualização

scene.add(
  new THREE.HemisphereLight(
    0xffffff,
    0x526047,
    1.5
  )
);

const luzPrincipal = new THREE.DirectionalLight(
  0xffffff,
  2
);

luzPrincipal.position.set(3, 5, 4);
scene.add(luzPrincipal);


// ==================================================
// GRUPOS DA ÁRVORE
// ==================================================

const arvore = new THREE.Group();
scene.add(arvore);

const modelo = new THREE.Group();
arvore.add(modelo);

const grupoPontos = new THREE.Group();
arvore.add(grupoPontos);


// ==================================================
// VARIÁVEIS
// ==================================================

let alturaArvore = 2;

let modeloCarregado = false;
let pontosCarregados = false;
let arAtivo = false;

let meshesModelo = [];

let posicoes = null;
let nPontos = 0;

let pontos = null;
let materialPontos = null;

let ultimoToque = -1000;

let mindarAtivo = null;

const relogio = new THREE.Clock();


// ==================================================
// MATERIAL DAS PARTÍCULAS
// ==================================================

const uniforms = {

  uSize: {
    value: TAMANHO_PONTO
  },

  uPixelRatio: {
    value: renderer.getPixelRatio()
  },

  uScale: {
    value: window.innerHeight * 0.5
  },

  uHit: {
    value: new THREE.Vector3()
  },

  uStrength: {
    value: 0
  },

  uRadius: {
    value: RAIO_TOQUE
  },

  uScatter: {
    value: FORCA_DISPERSAO
  },

  uTime: {
    value: 0
  },

  uTreeHeight: {
    value: 1
  }

};


materialPontos = new THREE.ShaderMaterial({

  uniforms,

  vertexColors: true,
  transparent: true,
  depthWrite: false,
  depthTest: true,
  blending: THREE.AdditiveBlending,

  vertexShader: `

    attribute vec3 aRand;

    uniform float uSize;
    uniform float uPixelRatio;
    uniform float uScale;
    uniform float uStrength;
    uniform float uRadius;
    uniform float uScatter;
    uniform float uTime;
    uniform float uTreeHeight;

    uniform vec3 uHit;

    varying vec3 vColor;
    varying float vAlpha;

    void main() {

      float distancia = distance(position, uHit);

      float zona = 1.0 - smoothstep(
        uRadius * 0.65,
        uRadius,
        distancia
      );

      float visibilidade = zona * uStrength;

      if (visibilidade < 0.01) {

        gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
        gl_PointSize = 0.0;

        vColor = vec3(0.0);
        vAlpha = 0.0;

        return;

      }

      // Direcção de dispersão

      vec3 direcao = normalize(
        position - uHit + aRand * 0.3 + vec3(0.0001)
      );

      float dispersao = uScatter * uStrength;

      vec3 p = position
        + direcao * dispersao * zona;

      p += aRand * dispersao * 0.35 * zona;

      // Varrimento luminoso vertical

      float posicaoLuz = fract(uTime * 0.12);

      float alturaLuz = posicaoLuz * uTreeHeight;

      float distanciaLuz = abs(position.y - alturaLuz);

      float scan = exp(
        -pow(distanciaLuz / 0.09, 2.0)
      );

      // Brilho local e brilho do scan

      float brilho = 1.0
        + visibilidade * 1.5
        + scan * 0.8;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);

      gl_PointSize = max(
        1.0,
        uSize * uPixelRatio
        * (uScale / max(-mv.z, 0.01))
        * (0.8 + visibilidade * 2.0)
      );

      gl_Position = projectionMatrix * mv;

      vColor = color * brilho;

      vAlpha = clamp(
        visibilidade * (0.55 + scan * 0.7),
        0.0,
        1.0
      );

    }

  `,

  fragmentShader: `

    varying vec3 vColor;
    varying float vAlpha;

    void main() {

      vec2 q = gl_PointCoord - vec2(0.5);

      float distancia = dot(q, q);

      if (distancia > 0.25) discard;

      float suavidade = 1.0 - smoothstep(
        0.12,
        0.25,
        distancia
      );

      gl_FragColor = vec4(
        vColor,
        vAlpha * suavidade
      );

      #include <colorspace_fragment>

    }

  `

});


// ==================================================
// CARREGAR MODELO GLB
// ==================================================

async function carregarModelo() {

  const loader = new GLTFLoader();

  const gltf = await loader.loadAsync(MODELO);

  modelo.add(gltf.scene);

  gltf.scene.updateMatrixWorld(true);

  const caixa = new THREE.Box3().setFromObject(
    gltf.scene
  );

  if (caixa.isEmpty()) {
    throw new Error('O modelo GLB não contém geometria.');
  }

  const centro = new THREE.Vector3();
  caixa.getCenter(centro);

  const dimensoes = new THREE.Vector3();
  caixa.getSize(dimensoes);

  alturaArvore = dimensoes.y;

  if (alturaArvore <= 0) {
    throw new Error('Não foi possível determinar a altura da árvore.');
  }

  // Centrar a árvore e colocar a base no nível zero

  gltf.scene.position.x -= centro.x;
  gltf.scene.position.y -= caixa.min.y;
  gltf.scene.position.z -= centro.z;

  gltf.scene.updateMatrixWorld(true);

  // Guardar os meshes para detectar os toques

  meshesModelo = [];

  gltf.scene.traverse((obj) => {

    if (obj.isMesh) {

      meshesModelo.push(obj);

    }

  });

  // Enquadramento inicial

  camera.position.set(
    0,

alturaArvore * 0.65,
alturaArvore * 2.5
);

controls.target.set(
  0,
  alturaArvore * 0.48,
  0
);

controls.update();

uniforms.uTreeHeight.value = alturaArvore;

modeloCarregado = true;


}


// ==================================================
// CARREGAR NUVEM DE PONTOS
// ==================================================

async function carregarPontos() {

  const resposta = await fetch(FICHEIRO);

  if (!resposta.ok) {
    throw new Error('Não foi possível carregar ' + FICHEIRO);
  }

  const buffer = await resposta.arrayBuffer();

  if (buffer.byteLength < 8) {
    throw new Error('O ficheiro BIN está incompleto.');
  }

  const dados = new DataView(buffer);

  const total = dados.getUint32(0, true);
  const escala = dados.getFloat32(4, true);

  if (!total || !escala) {
    throw new Error('O cabeçalho do ficheiro BIN é inválido.');
  }

  const tamanhoEsperado = 8 + total * 9;

  if (buffer.byteLength < tamanhoEsperado) {
    throw new Error('O ficheiro BIN não contém todos os pontos.');
  }

  const pos16 = new Int16Array(
    buffer,
    8,
    total * 3
  );

  const cor8 = new Uint8Array(
    buffer,
    8 + total * 6,
    total * 3
  );

  const n = Math.min(total, MAX_PONTOS);
  const passo = total / n;

  const posicoesOriginais = new Float32Array(n * 3);
  const cores = new Float32Array(n * 3);
  const aleatorio = new Float32Array(n * 3);

  const minimo = new THREE.Vector3(
    Infinity,
    Infinity,
    Infinity
  );

  const maximo = new THREE.Vector3(
    -Infinity,
    -Infinity,
    -Infinity
  );

  const cor = new THREE.Color();

  // Ler posições e cores

  for (let i = 0; i < n; i++) {

    const j = Math.floor(i * passo);

    const x = pos16[j * 3] / escala;
    const y = pos16[j * 3 + 1] / escala;
    const z = pos16[j * 3 + 2] / escala;

    posicoesOriginais[i * 3] = x;
    posicoesOriginais[i * 3 + 1] = y;
    posicoesOriginais[i * 3 + 2] = z;

    minimo.min(new THREE.Vector3(x, y, z));
    maximo.max(new THREE.Vector3(x, y, z));

    cor.setRGB(
      Math.min(cor8[j * 3] / 255 * BRILHO, 1),
      Math.min(cor8[j * 3 + 1] / 255 * BRILHO, 1),
      Math.min(cor8[j * 3 + 2] / 255 * BRILHO, 1),
      THREE.SRGBColorSpace
    );

    cores[i * 3] = cor.r;
    cores[i * 3 + 1] = cor.g;
    cores[i * 3 + 2] = cor.b;

    aleatorio[i * 3] = Math.random() * 2 - 1;
    aleatorio[i * 3 + 1] = Math.random() * 2 - 1;
    aleatorio[i * 3 + 2] = Math.random() * 2 - 1;

  }

  // Ajustar a nuvem à dimensão do modelo GLB

  const centroPontos = new THREE.Vector3();

  centroPontos
    .addVectors(minimo, maximo)
    .multiplyScalar(0.5);

  const alturaPontos = maximo.y - minimo.y;

  if (alturaPontos <= 0) {
    throw new Error('A nuvem de pontos não tem uma altura válida.');
  }

  const fator = alturaArvore / alturaPontos;

  posicoes = new Float32Array(n * 3);

  for (let i = 0; i < n; i++) {

    posicoes[i * 3] =
      (posicoesOriginais[i * 3] - centroPontos.x) * fator;

    posicoes[i * 3 + 1] =
      (posicoesOriginais[i * 3 + 1] - minimo.y) * fator;

    posicoes[i * 3 + 2] =
      (posicoesOriginais[i * 3 + 2] - centroPontos.z) * fator;

  }

  nPontos = n;

  const geometria = new THREE.BufferGeometry();

  geometria.setAttribute(
    'position',
    new THREE.BufferAttribute(posicoes, 3)
  );

  geometria.setAttribute(
    'color',
    new THREE.BufferAttribute(cores, 3)
  );

  geometria.setAttribute(
    'aRand',
    new THREE.BufferAttribute(aleatorio, 3)
  );

  pontos = new THREE.Points(
    geometria,
    materialPontos
  );

  pontos.frustumCulled = false;

  grupoPontos.add(pontos);

  pontosCarregados = true;

}


// ==================================================
// DETECTAR TOQUES NA ÁRVORE
// ==================================================

const raycaster = new THREE.Raycaster();

const coordenadas = new THREE.Vector2();

function tocar(x, y, camara, elemento) {

  if (!modeloCarregado || !pontosCarregados) return;

  const rect = elemento.getBoundingClientRect();

  if (!rect.width || !rect.height) return;

  coordenadas.x =
    ((x - rect.left) / rect.width) * 2 - 1;

  coordenadas.y =
    -((y - rect.top) / rect.height) * 2 + 1;

  arvore.updateMatrixWorld(true);

  raycaster.setFromCamera(
    coordenadas,
    camara
  );

  const interseccoes = raycaster.intersectObjects(
    meshesModelo,
    true
  );

  if (interseccoes.length === 0) return;

  const pontoLocal = arvore.worldToLocal(
    interseccoes[0].point.clone()
  );

  // Ignorar toques demasiado baixos, por exemplo no tronco

  if (pontoLocal.y < alturaArvore * ALTURA_MINIMA_TOQUE) {
    return;
  }

  uniforms.uHit.value.copy(pontoLocal);

  ultimoToque = performance.now() / 1000;

}


// ==================================================
// ANIMAÇÃO DAS PARTÍCULAS
// ==================================================

function atualizarParticulas() {

  if (!pontosCarregados) return;

  const agora = performance.now() / 1000;
  const tempo = agora - ultimoToque;

  let intensidade = 0;

  if (tempo >= 0) {

    intensidade = Math.exp(
      -tempo * (3 / TEMPO_REGRESSO)
    );

  }

  if (intensidade < 0.01) {
    intensidade = 0;
  }

  uniforms.uStrength.value = intensidade;

  uniforms.uTime.value += 0.016;

}


// ==================================================
// EVENTOS DE TOQUE
// ==================================================

function adicionarEventosToque(elemento, camara) {

  elemento.addEventListener('pointerdown', (e) => {

    tocar(
      e.clientX,
      e.clientY,
      camara,
      elemento
    );

  });

  elemento.addEventListener('pointermove', (e) => {

    if (e.buttons > 0 || e.pointerType === 'touch') {

      tocar(
        e.clientX,
        e.clientY,
        camara,
        elemento
      );

    }

  });

}


// ==================================================
// PRÉ-VISUALIZAÇÃO
// ==================================================

adicionarEventosToque(
  renderer.domElement,
  camera
);


// ==================================================
// INICIAR REALIDADE AUMENTADA
// ==================================================

async function iniciarAR() {

  if (arAtivo || !modeloCarregado || !pontosCarregados) {
    return;
  }

  arAtivo = true;

  botaoAR.style.display = 'none';
  nota.style.display = 'none';

  try {

    const { MindARThree } = await import(
      'mindar-image-three'
    );

    arContainer.style.display = 'block';

    const mindar = new MindARThree({

      container: arContainer,

      imageTargetSrc: MARCADOR

    });

    mindarAtivo = mindar;

    const {
      renderer: rendererAR,
      scene: sceneAR,
      camera: cameraAR
    } = mindar;

    // Fundo transparente para deixar ver a câmara

    sceneAR.background = null;

    rendererAR.setClearColor(0x000000, 0);

    rendererAR.domElement.style.background = 'transparent';

    // IMPORTANTE:
    // A cena AR precisa de iluminação própria.
    // As luzes da pré-visualização não passam automaticamente
    // para a cena criada pelo MindAR.

    sceneAR.add(
      new THREE.HemisphereLight(
        0xffffff,
        0x526047,
        1.5
      )
    );

    const luzAR = new THREE.DirectionalLight(
      0xffffff,
      2
    );

    luzAR.position.set(3, 5, 4);

    sceneAR.add(luzAR);

    const luzARSecundaria = new THREE.DirectionalLight(
      0xffffff,
      0.7
    );

    luzARSecundaria.position.set(-3, 2, -4);

    sceneAR.add(luzARSecundaria);

    // Criar âncora do marcador

    const ancora = mindar.addAnchor(0);

    // Dimensionar a árvore para o marcador

    arvore.scale.setScalar(
      ALTURA_AR / alturaArvore
    );

    arvore.position.set(0, 0, 0);
    arvore.rotation.set(0, 0, 0);

    ancora.group.add(arvore);

    // Esconder a pré-visualização

    renderer.domElement.style.display = 'none';

    await mindar.start();

    voltar.style.display = 'block';
    dica.style.display = 'block';

    // Eventos de toque na árvore em AR

    adicionarEventosToque(
      rendererAR.domElement,
      cameraAR
    );

    ancora.onTargetFound = () => {
      dica.style.display = 'none';
    };

    ancora.onTargetLost = () => {
      dica.style.display = 'block';
    };

    // Rotação e animação

    let ultimoTempo = performance.now();

    rendererAR.setAnimationLoop(() => {

      const agora = performance.now();

      const delta = Math.min(
        (agora - ultimoTempo) / 1000,
        0.05
      );

      ultimoTempo = agora;

      arvore.rotation.y += ROTACAO_AR * delta;

      // Actualizar o tempo real do shader

      uniforms.uTime.value += delta;

      atualizarParticulas();

      rendererAR.render(
        sceneAR,
        cameraAR
      );

    });

  } catch (erro) {

    console.error(erro);

    // Recuperar a pré-visualização se o AR falhar

    if (mindarAtivo) {

      try {
        await mindarAtivo.stop();
      } catch (e) {
        console.warn(e);
      }

      mindarAtivo = null;

    }

    arContainer.style.display = 'none';
    renderer.domElement.style.display = 'block';

    nota.textContent =
      'Não foi possível iniciar a realidade aumentada. Verifica a câmara, o marcador e a ligação à Internet.';

    nota.style.display = 'block';

    voltar.style.display = 'none';
    botaoAR.style.display = 'block';

    arAtivo = false;

  }

}


// ==================================================
// BOTÕES
// ==================================================

botaoAR.addEventListener(
  'click',
  iniciarAR
);

voltar.addEventListener(
  'click',
  () => location.reload()
);


// ==================================================
// REDIMENSIONAR
// ==================================================

window.addEventListener('resize', () => {

  camera.aspect =
    window.innerWidth / window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

  uniforms.uScale.value =
    window.innerHeight * 0.5;

  uniforms.uPixelRatio.value =
    renderer.getPixelRatio();

});


// ==================================================
// CARREGAMENTO INICIAL
// ==================================================


async function iniciar() {

  try {

    aviso.textContent = 'A carregar o modelo 3D…';
    await carregarModelo();

    aviso.textContent = 'A carregar a nuvem de pontos…';
    await carregarPontos();

    aviso.remove();

    renderer.setAnimationLoop(() => {

      controls.update();

      atualizarParticulas();

      renderer.render(
        scene,
        camera
      );

    });

  } catch (erro) {

    console.error('Erro ao iniciar a árvore:', erro);

    aviso.textContent =
      'Erro ao carregar: ' + (erro.message || String(erro));

    aviso.style.display = 'block';

  }

}

iniciar();

</script>
</body>
</html>
